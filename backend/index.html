<!DOCTYPE html>
<html>
<head>
  <title>AI News Dashboard</title>
</head>
<body>

<h1>🧠 AI News Dashboard</h1>

<div id="news"></div>

<script>
const BASE_URL = "https://ai-news-dashboard-3.onrender.com";

// Fetch news
fetch(`${BASE_URL}/news`)
.then(res => res.json())
.then(data => {
    let container = document.getElementById("news");

    data.forEach(item => {
        let div = document.createElement("div");

        div.style.border = "1px solid black";
        div.style.margin = "10px";
        div.style.padding = "10px";

        div.innerHTML = `
            <h3>${item.title}</h3>
            <p>${item.summary}</p>
            <a href="${item.link}" target="_blank">Read more</a><br><br>

            <button onclick="favorite('${item.title}', '${item.link}')">⭐ Favorite</button>
            <button onclick="broadcast('${item.title}')">📣 Broadcast</button>
        `;

        container.appendChild(div);
    });
});

// Favorite function
function favorite(title, link){
    fetch(`${BASE_URL}/favorite`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title, link})
    })
    .then(() => alert("Added to favorites ✅"));
}

// Broadcast function
function broadcast(title){
    fetch(`${BASE_URL}/broadcast`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title})
    })
    .then(res => res.json())
    .then(data => alert(data.caption));
}
</script>

</body>
</html>
